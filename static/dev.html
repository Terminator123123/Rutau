<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ColectivoU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!-- Auth screen -->
  <div id="auth-screen">
    <div id="bg-map"></div>
    <div class="auth-overlay"></div>

    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-mark">U</div>
        <h1>ColectivoU</h1>
        <p>Transporte universitario · Riohacha</p>
      </div>

      <div class="auth-tabs">
        <button class="tab active" onclick="showTab('login')">Ingresar</button>
        <button class="tab" onclick="showTab('register')">Registrarse</button>
      </div>

      <!-- Login -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <input type="email" id="login-email" placeholder="Correo electrónico" required autocomplete="email" />
        <input type="password" id="login-password" placeholder="Contraseña" required autocomplete="current-password" />
        <div id="login-error" class="form-msg hidden"></div>
        <button type="submit" class="btn-primary">Ingresar</button>
        <button type="button" class="btn-link" onclick="showForgot()">¿Olvidaste tu contraseña?</button>
      </form>

      <!-- Register -->
      <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
        <input type="text" id="reg-name" placeholder="Nombre completo" required maxlength="40" autocomplete="name" />
        <input type="email" id="reg-email" placeholder="Correo electrónico" required autocomplete="email" />
        <input type="password" id="reg-password" placeholder="Contraseña (mín. 6 caracteres)" required minlength="6" />
        <div class="role-select">
          <p class="role-label">Soy</p>
          <div class="role-btns">
            <button type="button" id="toggle-estudiante" class="role-opt active" onclick="selectRole('estudiante')">Estudiante</button>
            <button type="button" id="toggle-conductor" class="role-opt" onclick="selectRole('conductor')">Conductor</button>
          </div>
        </div>
        <input type="hidden" id="reg-role" value="estudiante" />
        <div id="register-msg" class="form-msg hidden"></div>
        <button type="submit" class="btn-primary">Crear cuenta</button>
      </form>
    </div>
  </div>

  <!-- Map screen -->
  <div id="map-screen" class="hidden">
    <div id="topbar">
      <span id="role-badge"></span>
      <button id="btn-status" class="hidden" onclick="cycleStatus()"></button>
      <div id="passenger-counter" class="hidden">
        <span id="counter-display">0/4</span>
        <button class="btn-manual" onclick="addManual()">+</button>
        <button class="btn-manual" onclick="removeManual()">−</button>
      </div>
      <span id="status-dot" class="dot connecting"></span>
      <span id="status-text">Conectando...</span>
      <button id="btn-logout" onclick="logout()">Salir</button>
    </div>
    <div id="map"></div>
    <div id="legend">
      <span><span class="dot-legend blue"></span>Estudiantes</span>
      <span><span class="dot-legend orange"></span>Disponible</span>
      <span><span class="dot-legend red"></span>Lleno</span>
      <span><span class="dot-legend yellow"></span>En camino</span>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ── Simulación colectivos Riohacha ──────────────────────────────────────
    var _bgMap = null, _bgTick = null;

    (function () {
      _bgMap = L.map('bg-map', {
        zoomControl: false, attributionControl: false,
        dragging: false, scrollWheelZoom: false, doubleClickZoom: false,
        boxZoom: false, keyboard: false, tap: false, touchZoom: false,
      }).setView([11.5396, -72.8980], 13);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(_bgMap);

      // Forzar recálculo de tamaño una vez el DOM haya terminado de pintar
      setTimeout(function () { _bgMap.invalidateSize(); }, 150);

      function mkCol() {
        return L.divIcon({ className: '', html: '<div class="bg-col"></div>', iconSize: [10, 10], iconAnchor: [5, 5] });
      }
      function mkPerson() {
        return L.divIcon({ className: '', html: '<div class="bg-person"></div>', iconSize: [7, 7], iconAnchor: [3, 3] });
      }

      // ── Coordenadas clave ──────────────────────────────────────────────────
      // UniGuajira: [11.5392, -72.9066]
      // Rompoi (barrio al este): [11.5405, -72.8870]
      // Ruta principal U → Rompoi va por la vía principal hacia el este

      var UNI    = [11.5392, -72.9066];
      var ROMPOI = [11.5405, -72.8870];

      // Ruta fija U ↔ Rompoi
      var rtRompoi = [
        [11.5392, -72.9066],
        [11.5393, -72.9010],
        [11.5395, -72.8960],
        [11.5398, -72.8920],
        [11.5401, -72.8890],
        [11.5405, -72.8870],
      ];

      // Rutas por el resto de Riohacha
      var rtNorte = [
        [11.5392, -72.9066],
        [11.5412, -72.9055],
        [11.5435, -72.9042],
        [11.5455, -72.9028],
        [11.5470, -72.9012],
        [11.5455, -72.9028],
        [11.5432, -72.9043],
        [11.5410, -72.9056],
        [11.5392, -72.9066],
      ];
      var rtSur = [
        [11.5392, -72.9066],
        [11.5372, -72.9078],
        [11.5350, -72.9095],
        [11.5325, -72.9118],
        [11.5300, -72.9140],
        [11.5278, -72.9162],
        [11.5300, -72.9140],
        [11.5326, -72.9117],
        [11.5350, -72.9095],
        [11.5373, -72.9077],
        [11.5392, -72.9066],
      ];
      var rtCentro = [
        [11.5392, -72.9066],
        [11.5410, -72.9068],
        [11.5430, -72.9070],
        [11.5448, -72.9072],
        [11.5462, -72.9068],
        [11.5448, -72.9072],
        [11.5430, -72.9070],
        [11.5410, -72.9068],
        [11.5392, -72.9066],
      ];
      var rtOeste = [
        [11.5392, -72.9066],
        [11.5380, -72.9050],
        [11.5365, -72.9038],
        [11.5350, -72.9025],
        [11.5338, -72.9015],
        [11.5350, -72.9025],
        [11.5365, -72.9038],
        [11.5380, -72.9050],
        [11.5392, -72.9066],
      ];

      // ── Crear colectivos ───────────────────────────────────────────────────
      // 5 en ruta Rompoi, escalonados; resto en rutas de ciudad
      var vehicles = [];

      function mkVehicle(route, wpOffset, dir) {
        dir = dir || 1;
        var wp = wpOffset % route.length;
        return {
          m: L.marker(route[wp], { icon: mkCol() }).addTo(_bgMap),
          route: route,
          wp: wp,
          dir: dir,
          pauseUntil: 0,
        };
      }

      // Ruta Rompoi (5 colectivos escalonados — van y vienen)
      for (var i = 0; i < 5; i++) {
        var wp = Math.round(i * (rtRompoi.length - 1) / 4);
        vehicles.push(mkVehicle(rtRompoi, wp, i % 2 === 0 ? 1 : -1));
      }

      // Rutas ciudad (8 colectivos en 4 rutas)
      [[rtNorte, 0], [rtNorte, 4], [rtSur, 0], [rtSur, 5],
       [rtCentro, 0], [rtCentro, 4], [rtOeste, 0], [rtOeste, 4]
      ].forEach(function(cfg) {
        vehicles.push(mkVehicle(cfg[0], cfg[1]));
      });

      // ── Puntos de espera (personas) ────────────────────────────────────────
      // Denses cerca a la U y al Rompoi; distribuidos por la ciudad
      var stops = [
        // Filas en la U (2 filas, 4 por fila)
        [11.5394, -72.9070], [11.5394, -72.9067], [11.5394, -72.9064], [11.5394, -72.9061],
        [11.5390, -72.9070], [11.5390, -72.9067], [11.5390, -72.9064], [11.5390, -72.9061],
        // Fila en Rompoi (5 puestos)
        [11.5407, -72.8874], [11.5407, -72.8870], [11.5407, -72.8866],
        [11.5407, -72.8862], [11.5407, -72.8858],
        // A lo largo de la ruta U-Rompoi
        [11.5393, -72.9010], [11.5396, -72.8958], [11.5399, -72.8920],
        // Rutas ciudad
        [11.5435, -72.9042], [11.5458, -72.9028], [11.5350, -72.9095],
        [11.5300, -72.9140], [11.5365, -72.9038], [11.5448, -72.9072],
        [11.5280, -72.9162],
      ];

      // ── Personas activas ───────────────────────────────────────────────────
      var people = [];

      function spawn() {
        if (people.length >= 18) return;
        var s = stops[Math.floor(Math.random() * stops.length)];
        people.push({ m: L.marker(s, { icon: mkPerson() }).addTo(_bgMap), pos: s });
      }

      // Arranque escalonado
      stops.forEach(function (_, i) { setTimeout(spawn, i * 250 + 100); });

      // ── Distancia ─────────────────────────────────────────────────────────
      function dist(a, b) { var x=a[0]-b[0],y=a[1]-b[1]; return Math.sqrt(x*x+y*y); }

      var SPEED  = 0.000038;
      var PICKUP = 0.003;

      // ── Tick principal ─────────────────────────────────────────────────────
      _bgTick = setInterval(function () {
        var now = Date.now();

        vehicles.forEach(function (v) {
          if (now < v.pauseUntil) return;  // pausa en extremo de ruta

          var p   = v.m.getLatLng();
          var nwp = v.wp + v.dir;

          // Llegó al extremo → pausa y reversa
          if (nwp < 0 || nwp >= v.route.length) {
            v.dir *= -1;
            v.pauseUntil = now + 1200 + Math.random() * 800;
            return;
          }

          var nx   = v.route[nwp];
          var dx   = nx[0] - p.lat, dy = nx[1] - p.lng;
          var d    = Math.sqrt(dx * dx + dy * dy);

          if (d < SPEED * 1.5) {
            v.wp = nwp;
            v.m.setLatLng(nx);
          } else {
            v.m.setLatLng([p.lat + dx / d * SPEED, p.lng + dy / d * SPEED]);
          }

          // Recoger personas cercanas
          var vp = [v.m.getLatLng().lat, v.m.getLatLng().lng];
          for (var i = people.length - 1; i >= 0; i--) {
            if (dist(vp, people[i].pos) < PICKUP) {
              people[i].m.remove();
              people.splice(i, 1);
              setTimeout(spawn, 1000 + Math.random() * 1800);
            }
          }
        });
      }, 50);
    })();

    window.__stopBgAnim = function () {
      if (_bgTick) { clearInterval(_bgTick); _bgTick = null; }
    };
  </script>
  <script src="/static/app.js"></script>
</body>
</html>
