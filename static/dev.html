<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ColectivoU</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <div id="role-screen">
    <div class="role-card">
      <h1>ColectivoU</h1>
      <p>Coordinacion de transporte en la Universidad de La Guajira</p>
      <p class="sub">Como vas hoy?</p>
      <div class="role-buttons">
        <button class="btn-role estudiante" onclick="startSession('estudiante')">
          Soy Estudiante
        </button>
        <button class="btn-role conductor" onclick="startSession('conductor')">
          Soy Conductor
        </button>
      </div>
    </div>
  </div>

  <div id="map-screen" class="hidden">
    <div id="topbar">
      <span id="role-badge"></span>
      <span id="status-dot" class="dot connecting"></span>
      <span id="status-text">Conectando...</span>
      <button id="btn-change-role" onclick="changeRole()">Cambiar rol</button>
    </div>
    <div id="map"></div>
    <div id="legend">
      <span><span class="dot-legend blue"></span> Estudiantes</span>
      <span><span class="dot-legend orange"></span> Conductores</span>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
