<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ColectivoU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!-- Mapa siempre visible — fondo antes del login y app real después -->
  <div id="map-screen">
    <div id="topbar" class="hidden">
      <span id="role-badge"></span>
      <button id="btn-status" class="hidden" onclick="cycleStatus()"></button>
      <div id="topbar-right">
        <span id="status-dot" class="dot connecting"></span>
        <span id="status-text">Conectando...</span>
        <button id="btn-logout" onclick="logout()">Salir</button>
      </div>
    </div>
    <div id="map"></div>
    <div id="passenger-counter" class="hidden">
      <button class="btn-manual" onclick="removeManual()">−</button>
      <span id="counter-display">0/4</span>
      <button class="btn-manual" onclick="addManual()">+</button>
    </div>
    <div id="legend" class="hidden">
      <span><span class="dot-legend blue"></span>Estudiantes</span>
      <span><span class="dot-legend orange"></span>Disponible</span>
      <span><span class="dot-legend red"></span>Lleno</span>
      <span><span class="dot-legend yellow"></span>En camino</span>
    </div>
  </div>

  <!-- Auth card flota sobre el mapa — desaparece al iniciar sesión -->
  <div id="auth-screen">
    <div class="auth-overlay"></div>

    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-mark">U</div>
        <h1>ColectivoU</h1>
        <p>Transporte universitario · Riohacha</p>
      </div>

      <div class="auth-tabs">
        <button class="tab active" onclick="showTab('login')">Ingresar</button>
        <button class="tab" onclick="showTab('register')">Registrarse</button>
      </div>

      <!-- Login -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <input type="email" id="login-email" placeholder="Correo electrónico" required autocomplete="email" />
        <input type="password" id="login-password" placeholder="Contraseña" required autocomplete="current-password" />
        <div id="login-error" class="form-msg hidden"></div>
        <button type="submit" class="btn-primary">Ingresar</button>
        <button type="button" class="btn-link" onclick="showForgot()">¿Olvidaste tu contraseña?</button>
      </form>

      <!-- Register -->
      <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
        <input type="text" id="reg-name" placeholder="Nombre completo" required maxlength="40" autocomplete="name" />
        <input type="email" id="reg-email" placeholder="Correo electrónico" required autocomplete="email" />
        <input type="password" id="reg-password" placeholder="Contraseña (mín. 6 caracteres)" required minlength="6" />
        <div class="role-select">
          <p class="role-label">Soy</p>
          <div class="role-btns">
            <button type="button" id="toggle-estudiante" class="role-opt active" onclick="selectRole('estudiante')">Estudiante</button>
            <button type="button" id="toggle-conductor" class="role-opt" onclick="selectRole('conductor')">Conductor</button>
          </div>
        </div>
        <input type="hidden" id="reg-role" value="estudiante" />
        <div id="register-msg" class="form-msg hidden"></div>
        <button type="submit" class="btn-primary">Crear cuenta</button>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
