<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ColectivoU</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!-- Auth screen -->
  <div id="auth-screen">
    <div class="role-card">
      <h1>ColectivoU</h1>
      <p>Coordinacion de transporte en la Universidad de La Guajira</p>

      <div class="auth-tabs">
        <button class="tab active" onclick="showTab('login')">Ingresar</button>
        <button class="tab" onclick="showTab('register')">Registrarse</button>
      </div>

      <!-- Login form -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <input type="email" id="login-email" placeholder="Correo electronico" required />
        <input type="password" id="login-password" placeholder="Contrasena" required />
        <div id="login-error" class="form-error hidden"></div>
        <button type="submit" class="btn-continue">Ingresar</button>
      </form>

      <!-- Register form -->
      <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
        <input type="text" id="reg-name" placeholder="Nombre completo" required maxlength="40" />
        <input type="email" id="reg-email" placeholder="Correo electronico" required />
        <input type="password" id="reg-password" placeholder="Contrasena" required minlength="6" />
        <div class="role-toggle">
          <button type="button" id="toggle-estudiante" class="toggle-btn active" onclick="selectRole('estudiante')">Estudiante</button>
          <button type="button" id="toggle-conductor" class="toggle-btn" onclick="selectRole('conductor')">Conductor</button>
        </div>
        <input type="hidden" id="reg-role" value="estudiante" />
        <div id="register-error" class="form-error hidden"></div>
        <button type="submit" class="btn-continue">Crear cuenta</button>
      </form>
    </div>
  </div>

  <!-- Map screen -->
  <div id="map-screen" class="hidden">
    <div id="topbar">
      <span id="role-badge"></span>
      <button id="btn-status" class="hidden" onclick="cycleStatus()"></button>
      <div id="passenger-counter" class="hidden">
        <span id="counter-display">0/4</span>
        <button class="btn-manual" onclick="addManual()" title="Agregar pasajero sin app">+</button>
        <button class="btn-manual minus" onclick="removeManual()" title="Quitar pasajero sin app">−</button>
      </div>
      <span id="status-dot" class="dot connecting"></span>
      <span id="status-text">Conectando...</span>
      <button id="btn-logout" onclick="logout()">Salir</button>
    </div>
    <div id="map"></div>
    <div id="legend">
      <span><span class="dot-legend blue"></span> Estudiantes</span>
      <span><span class="dot-legend orange"></span> Disponible</span>
      <span><span class="dot-legend red"></span> Lleno</span>
      <span><span class="dot-legend yellow"></span> En camino</span>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
